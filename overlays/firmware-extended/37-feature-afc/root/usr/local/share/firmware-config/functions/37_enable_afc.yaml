settings:
  snapmaker_components:
    items:
      canbus:
        label: Enable AFC
        description: Enables use of AFC-Klipper-Add-On by copying over necessary files.
        get_cmd:
          - bash
          - -c
          - test -f /home/lava/klipper/klippy/extras/AFC_unit.py && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: Enabled
            confirm: "Enable AFC-Klipper-Add-On? This adds support for full AFC-Klipper-Add-On."
            cmd:
            - bash
            - -xc
            - |
              touch /oem/.debug &&
              cp /home/lava/klipper/klippy/extras/AFC.py /home/lava/klipper/klippy/extras/AFC.py.lite &&
              cp /home/lava/klipper/klippy/extras/AFC_unit.py /home/lava/klipper/klippy/extras/AFC_unit.py.lite &&
              cp /home/lava/klipper/klippy/extras/AFC_lane.py /home/lava/klipper/klippy/extras/AFC_lane.py.lite &&
              ln -sf /home/lava/AFC-Klipper-Add-On/extras/AFC*.py /home/lava/klipper/klippy/extras/ &&
              echo "AFC enabled. Restarting Klipper..." &&
              /etc/init.d/S60klipper restart
          disabled:
            label: Disable
            confirm: "Disable AFC-Klipper-Add-On?"
            cmd:
              - bash
              - -xc
              - |
                find . -type l -name "*AFC*" -exec rm {} \; &&
                cp /home/lava/klipper/klippy/extras/AFC.py.lite /home/lava/klipper/klippy/extras/AFC.py &&
                cp /home/lava/klipper/klippy/extras/AFC_unit.py.lite /home/lava/klipper/klippy/extras/AFC_unit.py &&
                cp /home/lava/klipper/klippy/extras/AFC_lane.py.lite /home/lava/klipper/klippy/extras/AFC_lane.py &&
                echo "AFC disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled